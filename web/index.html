<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PenWin">
  <meta name="theme-color" content="#121417">
  <title>PenWin</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app" data-side="left">
    <aside id="toolbar" data-i18n-aria="toolbar">
      <div class="brand">Pen<b>Win</b></div>

      <section class="group">
        <h2 data-i18n="group.button"></h2>
        <button class="tool" data-btn="L" aria-pressed="true"><span data-i18n="btn.left"></span><small data-i18n="btn.left.sub"></small></button>
        <button class="tool" data-btn="R" aria-pressed="false"><span data-i18n="btn.right"></span><small data-i18n="btn.right.sub"></small></button>
        <button class="tool" data-btn="M" aria-pressed="false"><span data-i18n="btn.pan"></span><small data-i18n="btn.pan.sub"></small></button>
        <button class="tool" data-btn="O" aria-pressed="false"><span data-i18n="btn.orbit"></span><small data-i18n="btn.orbit.sub"></small></button>
      </section>

      <section class="group">
        <h2 data-i18n="group.hold"></h2>
        <button class="tool" data-mod="shift" aria-pressed="false">Shift</button>
        <button class="tool" data-mod="ctrl" aria-pressed="false">Ctrl</button>
      </section>

      <section class="group">
        <h2 data-i18n="group.keys"></h2>
        <button class="tool" data-key="esc">Esc</button>
        <button class="tool" data-key="enter">Enter</button>
        <button class="tool" data-key="ctrl+z"><span data-i18n="key.undo"></span><small>ctrl+z</small></button>
        <button class="tool" data-key="ctrl+y"><span data-i18n="key.redo"></span><small>ctrl+y</small></button>
        <button class="tool" data-key="delete"><span data-i18n="key.delete"></span><small>del</small></button>
        <button class="tool" data-key="tab">Tab<small data-i18n="key.tab.sub"></small></button>
        <button class="tool" data-wheel="120">+<small>zoom</small></button>
        <button class="tool" data-wheel="-120">−<small>zoom</small></button>
      </section>

      <section class="group">
        <h2 data-i18n="group.view"></h2>
        <button class="switch" id="mirrorSwitch" role="switch" aria-checked="false">
          <span class="track"><span class="knob"></span></span>
          <span class="switch-label"><span data-i18n="mirror.label"></span><small id="mirrorHint"></small></span>
        </button>
      </section>

      <button class="tool settings-btn" id="settingsBtn" data-i18n="settings"></button>
    </aside>

    <main id="padWrap">
      <div id="pad">
        <div id="area"><img id="shot" alt="" hidden><span class="corner tl"></span><span class="corner br"></span></div>
        <canvas id="ink"></canvas>
        <div id="status" role="status">
          <span class="dot" data-state="off"></span>
          <span id="statusText"></span>
          <span id="latency" class="mono"></span>
          <span id="modeBadge" class="badge"></span>
          <span id="hoverBadge" class="badge dim" data-i18n-title="hover.title">Hover ?</span>
        </div>
        <div id="notice" hidden></div>
      </div>
    </main>
  </div>

  <dialog id="settings">
    <form method="dialog" class="sheet">
      <header>
        <h1 data-i18n="settings"></h1>
        <button value="close" class="close" data-i18n="close"></button>
      </header>

      <label class="row">
        <span data-i18n="set.lang"></span>
        <select name="lang">
          <option value="tr">Türkçe</option>
          <option value="en">English</option>
        </select>
      </label>

      <fieldset>
        <legend data-i18n="set.mode"></legend>
        <label class="choice"><input type="radio" name="mode" value="mouse"> <span data-i18n-html="set.mode.mouse"></span></label>
        <label class="choice"><input type="radio" name="mode" value="pen"> <span data-i18n-html="set.mode.pen"></span></label>
      </fieldset>

      <label class="row">
        <span data-i18n="set.screen"></span>
        <select name="mon"></select>
      </label>

      <label class="row">
        <span><span data-i18n="set.deadzone"></span> <output name="deadzoneOut" class="mono"></output></span>
        <input type="range" name="deadzone" min="0" max="16" step="1">
        <small data-i18n="set.deadzone.help"></small>
      </label>

      <label class="row">
        <span><span data-i18n="set.threshold"></span> <output name="thresholdOut" class="mono"></output></span>
        <input type="range" name="threshold" min="0" max="0.6" step="0.05">
        <small data-i18n="set.threshold.help"></small>
      </label>

      <label class="row">
        <span><span data-i18n="set.opacity"></span> <output name="mirrorOpacityOut" class="mono"></output></span>
        <input type="range" name="mirrorOpacity" min="0.1" max="0.9" step="0.05">
        <small data-i18n="set.opacity.help"></small>
      </label>

      <label class="check"><input type="checkbox" name="gestures"> <span data-i18n="set.gestures"></span></label>
      <label class="check"><input type="checkbox" name="trail"> <span data-i18n="set.trail"></span></label>
      <label class="check"><input type="checkbox" name="sideRight"> <span data-i18n="set.side"></span></label>

      <label class="row">
        <span data-i18n="set.token"></span>
        <input type="text" name="token" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" class="mono">
        <small data-i18n="set.token.help"></small>
      </label>

      <div class="actions">
        <button type="button" id="fullscreenBtn" data-i18n="set.fullscreen"></button>
        <button type="button" id="reconnectBtn" data-i18n="set.reconnect"></button>
      </div>
      <p class="hint" data-i18n-html="set.hint"></p>
    </form>
  </dialog>
</body>
</html>
